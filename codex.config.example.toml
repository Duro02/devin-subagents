# ~/.codex/config.toml fragment
# Codex spawns this bridge as a stdio MCP server per session.

[mcp_servers.devin]
command = "node"
args = ["/home/duro/Projects/devin_subagents/dist/index.js"]

# Optional: copy devin-subagents.config.example.json to
# devin-subagents.config.json, edit it, and point the bridge at it:
# args = ["/home/duro/Projects/devin_subagents/dist/index.js",
#         "--config", "/home/duro/Projects/devin_subagents/devin-subagents.config.json"]
#
# No env block is needed — the bridge reads no DEVIN_* variables.
# See devin-subagents.config.example.json / README for the config keys.
